name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: relay

      - name: Install dependencies and verify TypeScript
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run build
          bun test

      - name: Verify Rust formatting, clippy, and tests
        working-directory: relay
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  binaries:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: relay

      - name: Build release binary
        run: cargo build --manifest-path relay/Cargo.toml --release --target ${{ matrix.target }} --bin wisp-wt-relay

      - name: Package binary and checksum
        shell: bash
        run: |
          mkdir -p dist
          tar -C relay/target/${{ matrix.target }}/release -czf dist/wisp-wt-relay-${{ matrix.target }}.tar.gz wisp-wt-relay
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum wisp-wt-relay-${{ matrix.target }}.tar.gz > wisp-wt-relay-${{ matrix.target }}.tar.gz.sha256)
          else
            (cd dist && shasum -a 256 wisp-wt-relay-${{ matrix.target }}.tar.gz > wisp-wt-relay-${{ matrix.target }}.tar.gz.sha256)
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: relay-${{ matrix.target }}
          path: dist/*

  github-release:
    needs: [verify, binaries]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Pack npm tarball
        run: |
          bun install --frozen-lockfile
          bun run build
          npm pack --pack-destination release-assets

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*

  docker:
    needs: verify
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/wisp-wt-relay"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="sha-${GITHUB_SHA::7}"
          fi
          echo "tags=${IMAGE}:${TAG},${IMAGE}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.relay
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}

  publish-npm:
    needs: verify
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2

      - name: Build and publish to npm (OIDC Trusted Publishing)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          npm install -g npm@latest
          bun install --frozen-lockfile
          bun run build
          npm publish --access public

  publish-crate:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Publish crate to crates.io (when CARGO_REGISTRY_TOKEN is set)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [[ -n "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            cargo publish --manifest-path relay/Cargo.toml --locked
          else
            echo "CARGO_REGISTRY_TOKEN not set; skipping crates.io publish."
          fi
